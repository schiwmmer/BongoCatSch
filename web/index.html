<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>番茄钟 · 修为</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%8D%85%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
    <!-- Vendored, not the CDN: jsdelivr is unreachable from mainland networks, and a
         login page that cannot load its SDK is a blank page. Refresh with
         `just web-sdk`. -->
    <script src="./vendor/workbuddy-cloud-sdk.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-cat">🐱</span>
        <span class="brand-name">番茄钟</span>
        <span class="brand-sub">专注时长积累修为 · 记录存在云端</span>
      </div>
      <div class="topstats" id="topstats"></div>
      <div class="account" id="account" hidden>
        <span class="account-email" id="account-email"></span>
        <span class="sync" id="sync">已同步</span>
        <button class="btn small ghost" id="sign-out">退出</button>
      </div>
    </header>

    <div class="shell">
      <nav class="rail" id="rail"></nav>
      <main class="stage" id="stage">
        <div class="boot">正在载入修为…</div>
      </main>
    </div>

    <div class="toast-stack" id="toasts"></div>

    <div class="gate" id="gate" hidden>
      <form class="gate-card" id="gate-form">
        <div class="gate-title">登录后继续</div>
        <p class="gate-sub">任务、专注记录和修为都存在云端，换台设备也还在。</p>
        <label class="field">
          <span class="field-label">邮箱</span>
          <input type="email" id="gate-email" autocomplete="email" placeholder="you@example.com" required />
        </label>
        <label class="field">
          <span class="field-label">验证码</span>
          <span class="gate-row">
            <input type="text" id="gate-code" inputmode="numeric" autocomplete="one-time-code" placeholder="邮件里的验证码" />
            <button type="button" class="btn small" id="gate-send">获取验证码</button>
          </span>
        </label>
        <button type="submit" class="btn primary gate-submit" id="gate-submit">登录 / 注册</button>
        <div class="gate-error" id="gate-error"></div>
      </form>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
